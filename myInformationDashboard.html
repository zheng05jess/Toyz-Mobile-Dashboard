<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>My Information Dashboard</title>
    <meta name="User Dashboard Default Main Page - My Information " content="My Information Dashboard" description="one of two main dashboard pages on the My Information tab">
    <link href="css/styles.css" type="text/css" rel="stylesheet" />
    <!--Link Bootstrap-5-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Import Lato and ____ fonts from Google Fonts-->
    <link href='https://fonts.googleapis.com/css?family=Lato' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
</head>

<body>
<!--Nav Bar (center DahVarsity AI logo included in background image, buttons)-->
    <nav>
        <div id="navbar" class="container-sm">
            <div class="row">
                <div class="col-sm-2">
                    <!--Volume Icon Button (not implemented) Left-Aligned-->
                    <img src="images/volumeIcon.png" alt="Volume Icon" class="navIcon" id="volumeIcon">
                </div>
                <div class="col-sm-8">
                    <!--DahVarsity AI Logo Image Centered-->
                    <img src="images/dahVarsityAILogo.png" alt="DahVarsity AI Logo" class="navLogo" id="dahVarsityAILogo">
                </div>
                <div class="col-sm-2">
                    <!--Menu Bar Icon (not implemented) Right-Aligned-->
                    <img src="images/menuBar.png" alt="Menu Bar Icon" class="navIcon" id="menuBarIcon">   
                </div> 
            </div>

        </div>
        
    </nav>

<!--Dashboard (On My Information Tab)-->
<div id="dashboardContainer">
    <!--Dashboard Top Section- Basic User Info-->
    <div id="dashboardTopSection" class="container-sm">
        <div class="row">
            <!--Player Avatar Image-->
            <div class="col-3">
                <img src="images/avatarIcon.png" alt="User Avatar" class="userAvatarImage">
            </div>
            <!--Player Greeting-->
            <div class="col-9">
                <!--"Welcome back," message-->
                <h5>Welcome back,</h5>
                <!--[Player Name]-->
                <h2>Taylor Lynn</h2>
            </div>
        </div>
        <div class="row">
            <!--"Superhero Name: " [Player Name]"-->
            <h3>Superhero Name: Tee Lynn</h3>
        </div>
        <!--Status Row-->
        <div class="row">
            <!--"Learning Status: [numDays] Days-->
            <div class="col-3">
                <h4>Learning Status: <br> 52 Days</h4>
            </div>
            <!--"Hero Status: [heroStatus]-->
            <div class="col-3">
                <h4>Hero Status: <br> Superhero</h4>
            </div>
        </div>
    </div>

    <!--Dashboard Top-Middle Tab Section- My Information Currently Displayed-->
    <div id="dashboardTabSection">
        <!--My Information Tab Label-->
            <h4>My Information</h4>
        <!--AI Resources Tab Label-->
            <h4>AI Resources</h4>
    </div>

    <!--Dashbaord Middle Section- Superhero Avatar-->
    <div id="dashboardMiddleAvatarSection" class="container-sm">
        <div class="row">
            <!--New Avatar Button (not implemented)-->
            <div class="col-3">
                <img src="images/newAvatarIcon.png" alt="Create New Avatar Button Icon" class="playerAvatarIcon">
                <h6>New Avatar</h6>
            </div>
            <!--Avatar Image-->
            <div class="col-6">
                <img src="images/playerAvatar.png" alt="Player Avatar Image" class="playerAvatarImage"> <!--SEE IMAGES BOOTSTRAP CENTERING OPTIONS-->
            </div>        
            <!--Edit Avatar Button (not implemented)-->
            <div class="col-3">
                <img src="images/editAvatarIcon.png" alt="Edit Avatar Button Icon" class="editAvatar">
                <h6>Edit Avatar</h6>
            </div>
        </div>
    </div>
</div>
        
    <!--Dashboard Bottom Section- My Information Cards-->
    <div id="dashboardBottomSection" class="container-sm">
        
        <!--Option Buttons in Top Corner of My Information Menu-->
        <div class="dashboardOptionButtons">
            <!--Settings Button (not implemented)-->
            <img src="images/settingIcon.png" alt="Setting Button Icon">
            <!--AI Chat Button (not implemented)-->
            <img src="images/chatAiIcon.png" alt="AI Chat Button Icon">
        </div>

        <!--My Information Option Buttons-->
        <div class="container-fluid">
            <!--Superhero Story Option Button-->
            
            <!--Personal Story Option Button-->

            <!--Superhero Video Option Button-->

            <!--Resume Option Button-->

            <!--Career Survey Option Button-->
        </div>
    </div>
</div>

<!--Steam Points-->
<div id="steamPoints">
    <!--Steam Points Header-->
    <div id="steamPointsHeader" class="continer-sm">
        <div class="row">
            <!--Steam Points Heading-->
            <div class="col-5">
                <h3>STEAM POINTS</h3>
            </div>
                <!--Steam Points Information Button-->
            <div class="col-1">
                <img src="images/informationIcon.png" alt="Information Icon" class="">
            </div>
        </div>
    </div>
    <!--Steam Point Card Displays-->
    <div id="steamPointCards" class="container-sm">

        <!--First three steam point cards on first row-->
        <div class="row">
            <!--Science Steam Point Card-->
            <div class="col-3">
                <!--Science Steam Point Image-->
                <img src="images/scienceIcon.png" alt="Science STEAM Point icon" class="">
                <!--Science Steam Point Value-->
                <h4>0</h4>
                <!--Science Steam Point Label-->
                <h6>Science</h6>
            </div>

            <!--Technology Steam Point Card-->
            <div class="col-3">
                <!--Technology Steam Point Image-->
                <img src="images/technologyIcon.png" alt="Technology STEAM Point icon" class="">
                <!--Technology Steam Point Value-->
                <h4>0</h4>
                <!--Technology Steam Point Label-->
                <h6>Technology</h6>
            </div>

            <!--Engineering Steam Point Card-->
            <div class="col-3">
                <!--Engineering Steam Point Image-->
                <img src="images/engineeringIcon.png" alt="Engineering STEAM Point icon" class="">
                <!--Engineering Steam Point Value-->
                <h4>0</h4>
                <!--Engineering Steam Point Label-->
                <h6>Engineering</h6>
            </div>
        </div>
        
        <!--last two steam point cards on second row-->
        <div class="row">
            <!--Art Steam Point Card-->
            <div class="col-3">
                <!--Art Steam Point Image-->
                <img src="images/artIcon.png" alt="Art STEAM Point icon" class="">            
                <!--Art Steam Point Value-->
                <h4>0</h4>
                <!--Art Steam Point Label-->
                <h6>Art</h6>
            </div>

            <!--Math Steam Point Card-->
            <div class="col-3">
                <!--Math Steam Point Image-->
                <img src="images/mathIcon.png" alt="Math STEAM Point icon" class="">
                <!--Math Steam Point Value-->
                <h4>0</h4>
                <!--Math Steam Point Label-->
                <h6>Math</h6>
            </div>
        </div>
        
    </div>
</div>

</body>

</html>
